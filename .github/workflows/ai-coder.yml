name: "Otonom AI Kodu Gelistirici"

on:
  issues:
    types: [opened, labeled]

jobs:
  ai_developer:
    if: contains(github.event.issue.labels.*.name, 'ai-code') || github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Aider AI Ajanini Kur
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat

      - name: AI Görevi Çalıştırsın
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git config --global user.name "AI-Developer-Bot"
          git config --global user.email "ai-bot@github.com"
          
          # Issue içeriğini al
          ISSUE_TITLE="${{ github.event.issue.title }}"
          ISSUE_BODY="${{ github.event.issue.body }}"
          FULL_PROMPT="GÖREV: $ISSUE_TITLE\n\nDETAYLAR:\n$ISSUE_BODY"
          
          # Aider'ı Gemini Pro ile otomatik çalıştır
          aider --model gemini/gemini-1.5-pro-latest --message "$FULL_PROMPT" --yes-always

      - name: Değişiklikleri Depoya Push Et
        run: |
          git push origin main
          
