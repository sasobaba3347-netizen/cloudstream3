name: Build APK from Zip

on:
  push:
    paths:
      - '**/*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project zip
        id: extract
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: Repo kök dizininde .zip dosyası bulunamadı."
            exit 1
          fi
          echo "Bulunan zip: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR=$(find extracted -maxdepth 4 -name "gradlew" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "HATA: gradlew dosyası bulunamadı, proje yapısı beklenmedik."
            exit 1
          fi
          echo "Proje klasörü: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ${{ steps.extract.outputs.project_dir }}

      - name: Initialize dummy git repo (required by app's generateGitHash task)
        run: |
          git init -q
          git config user.email "ci@example.com"
          git config user.name "CI"
          git add -A
          git commit -q -m "CI build" --allow-empty
        working-directory: ${{ steps.extract.outputs.project_dir }}

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: ${{ steps.extract.outputs.project_dir }}

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find "${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk" -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: Create release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Otomatik Derleme #${{ github.run_number }}"
          files: ${{ steps.find_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
